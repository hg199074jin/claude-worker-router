[worker]
command = "claude"
provider = "cc-switch-current"
max_turns = 12
timeout_seconds = 1200
correction_limit = 1
max_changed_files = 5
max_diff_lines = 500
allowed_test_binaries = ["uv", "python3", "npm"]

# Replace these placeholders with absolute paths on your machine.
run_records = "/absolute/path/to/.codex/model-router/runs"
test_output_limit_bytes = 65536
claude_settings = "/absolute/path/to/.claude/settings.json"

# V1.2 accepts only "deny": worker runs that add, modify, or delete any
# binary file escalate with binary-change-denied.
binary_edit_policy = "deny"
