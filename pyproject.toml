[project]
name = "claude-worker-router"
version = "0.1.0"
description = "Provider-neutral Claude Code worker executor for Codex"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
claude-worker-router = "claude_worker_router.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/claude_worker_router"]